<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weapon Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="detail-hero">
  <div class="detail-overlay">
    <span class="detail-category">WEAPON</span>
    <h1 id="weaponName">WEAPON</h1>
  </div>
</header>

<section class="detail-body">
  <div class="detail-info">
    <h2 class="section-title">STATS</h2>

    <div class="info-row">
  <span>MOUNT</span>
  <span id="weaponMount"></span>
</div>

<div class="info-row">
  <span>TYPES</span>
  <span id="weaponTypes"></span>
</div>

    <div class="info-row">
      <span>TIER</span>
      <span id="weaponTier"></span>
    </div>

    <div class="info-row">
      <span>SL</span>
      <span id="weaponSL"></span>
    </div>

    <div class="info-row">
      <span>HT</span>
      <span id="weaponHT"></span>
    </div>
  </div>

  <div class="detail-visual">
    <img id="weaponImage">
  </div>
</section>

<script src="weaponsData.js"></script>
<script src="siegeWeapons.js"></script>
<script src="weapon.js"></script>
</body>
</html>
