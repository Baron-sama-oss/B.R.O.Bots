<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Siege Engine Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="detail-hero">
  <div class="detail-overlay">
    <span class="detail-category">SIEGE ENGINE</span>
    <h1 id="siegeName">ENGINE</h1>
  </div>
</header>

<section class="detail-body">

  <div class="detail-info">
    <h2 class="section-title">STATS</h2>

    <div class="info-row">
      <span>ABILITY</span>
      <span id="siegeAbility"></span>
    </div>

    <div class="info-row">
      <span>HP</span>
      <span id="siegeHP"></span>
    </div>

    <div class="info-row">
      <span>SPEED</span>
      <span id="siegeSpeed"></span>
    </div>

    <div class="info-row">
      <span>SLC</span>
      <span id="siegeSLC"></span>
    </div>

  </div>

  <div class="detail-visual">
    <img id="siegeImage">
  </div>

</section>

<script src="enginesData.js"></script>
<script src="siege.js"></script>

</body>
</html>
